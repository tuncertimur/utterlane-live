name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same installers a user runs (CPU build, models skipped).
      - name: Install (macOS / Linux)
        if: runner.os != 'Windows'
        run: ./install.sh --cpu --skip-models
      - name: Install (Windows PowerShell 5.1, like Utterlane.cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Cpu -SkipModels -NoShortcut

      - name: Developer tools
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then UV=.tools/uv.exe; else UV=.tools/uv; fi
          if [ "$RUNNER_OS" = "macOS" ]; then BACKEND=""; else BACKEND="--torch-backend cpu"; fi
          $UV pip install --python .venv $BACKEND -e ".[dev]"

      - name: Lint and types
        if: runner.os == 'Linux'
        run: |
          .venv/bin/ruff check src tests scripts examples
          .venv/bin/ruff format --check src tests scripts examples
          .venv/bin/mypy

      - name: Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          $PY -m pytest -q

      - name: Smoke test (app in mock mode, REST + MCP)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          $PY scripts/smoke.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  release-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No secrets, personal paths, audio or weights
        run: python3 scripts/check_release.py
