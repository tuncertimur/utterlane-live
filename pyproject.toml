[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "utterlane-live"
version = "0.1.0"
description = "Local, speaker-aware voice front-end for AI assistants: knows who is talking, answers by voice, plugs into OpenClaw, Hermes Agent or any MCP / OpenAI-compatible agent."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Tuncer Timur" }]
keywords = ["voice", "speaker-recognition", "diarization", "speech-to-text", "tts", "mcp", "openclaw", "hermes-agent", "turkish", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=13",
  "numpy>=1.26",
  "onnxruntime>=1.20",
  "sherpa-onnx>=1.12",
  "faster-whisper>=1.1",
  "ctranslate2>=4.5",
  "openai>=1.80",
  "httpx>=0.27",
  "cryptography>=43",
  "keyring>=25",
  "huggingface_hub>=0.30",
  "torch>=2.5",
  "pocket-tts>=3.3",
  "pocket-tts-turkish>=0.1",
  "mcp>=2.3",
]

[project.optional-dependencies]
# CUDA 12 runtime libraries for faster-whisper on NVIDIA GPUs (Windows / Linux).
cuda = [
  "nvidia-cublas-cu12>=12.4; sys_platform != 'darwin'",
  "nvidia-cudnn-cu12>=9.1; sys_platform != 'darwin'",
]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
utterlane = "utterlane_live.cli:main"

[project.urls]
Homepage = "https://tuncertimur.github.io/utterlane-live/"
Repository = "https://github.com/tuncertimur/utterlane-live"
Issues = "https://github.com/tuncertimur/utterlane-live/issues"
Changelog = "https://github.com/tuncertimur/utterlane-live/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
utterlane_live = ["web/**/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/utterlane_live"]

[[tool.mypy.overrides]]
module = ["pocket_tts", "pocket_tts.*", "pocket_tts_turkish", "pocket_tts_turkish.*"]
ignore_missing_imports = true
